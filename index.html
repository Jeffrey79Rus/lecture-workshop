<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecture Workshop</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--line:#e3e3e3;--acc:#0b5cab}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#eee;--mut:#999;--line:#2c2c2c;--acc:#6aa9ff}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Segoe UI","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:56px 16px}
h1{font-size:24px;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 32px}
a.card{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--acc)}
a.card b{display:block;color:var(--acc)}
a.card span{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
<h1>Lecture Workshop</h1>
<p class="sub">강연·워크숍 자료 모음</p>
<a class="card" href="ax-latecomer/">
<b>후발주자 AX 강연 덱</b>
<span>슬라이드 자료 · 방향키(← →)로 넘기기, F11 전체 화면</span>
</a>
</main>
</body>
</html>
